name: Publish to npm

# Runs when a version tag (e.g. v0.1.1, created by `npm version`) is pushed.
on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write  # npm trusted publishing (OIDC)
  contents: write  # create the GitHub release

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # needed to check the tag is on main

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm >= 11.5.1; don't depend on what Node 24 bundles.
      - run: npm install -g npm@latest

      - name: Check tag matches package.json and is on main
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points to a commit that is not on main"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # Idempotent: a version published by hand (e.g. the very first release) is skipped, not re-published.
      - name: Publish to npm
        run: |
          if npm view "loopwright@$VERSION" version >/dev/null 2>&1; then
            echo "loopwright@$VERSION is already on npm; skipping publish."
          else
            npm publish --access public
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; skipping."
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes
          fi
